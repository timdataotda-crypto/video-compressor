name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch static FFmpeg
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch_static_ffmpeg_windows.ps1
      - name: Build exe
        run: python -m PyInstaller --noconfirm build_windows.spec
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe tidak ditemukan setelah instalasi Inno Setup" }
          & $iscc installer\windows_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup gagal dengan exit code $LASTEXITCODE" }
        shell: pwsh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DroneCompressor-Setup-windows
          path: dist/DroneCompressor-Setup.exe
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: DroneCompressor-windows-portable
          path: dist/DroneCompressor/

  build-macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            zip_name: DroneCompressor-macos.zip
            artifact: DroneCompressor-macos
          - os: macos-latest
            zip_name: DroneCompressor-macos-arm64.zip
            artifact: DroneCompressor-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm architecture
        run: uname -m && python -c "import platform; print(platform.machine())"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch static FFmpeg
        run: bash scripts/fetch_static_ffmpeg_macos.sh
      - name: Build app
        run: python -m PyInstaller --noconfirm build_macos.spec
      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - dist/DroneCompressor.app
          xattr -cr dist/DroneCompressor.app || true
          file dist/DroneCompressor.app/Contents/MacOS/DroneCompressor
          cd dist && ditto -c -k --keepParent DroneCompressor.app "${{ matrix.zip_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip_name }}

  release:
    # Membuat halaman unduhan publik saat tag v* dipush,
    # sehingga installer bisa dibagikan lewat satu link.
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DroneCompressor-Setup-windows/DroneCompressor-Setup.exe
            artifacts/DroneCompressor-macos/DroneCompressor-macos.zip
            artifacts/DroneCompressor-macos-arm64/DroneCompressor-macos-arm64.zip
          generate_release_notes: true
